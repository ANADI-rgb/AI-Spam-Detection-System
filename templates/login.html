<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login - AI Spam Detection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
min-height:100vh;
background:linear-gradient(-45deg,#6366f1,#9333ea,#22c55e,#0ea5e9);
background-size:400% 400%;
animation:gradientBG 10s ease infinite;
font-family:Segoe UI;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar{
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
}

.login-card{
width:380px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
box-shadow:0 10px 25px rgba(0,0,0,0.25);
transition:0.3s;
}

.login-card:hover{
transform:translateY(-5px);
}

.logo{
font-size:40px;
color:#6366f1;
}

input{
border-radius:10px;
}

button{
border-radius:10px;
font-weight:500;
}

.link-text a{
text-decoration:none;
font-weight:500;
color:#6366f1;
}

.link-text a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">

<a class="navbar-brand" href="#">
<i class="bi bi-shield-lock-fill"></i> Spam AI
</a>

<div class="ms-auto">

<a href="/login" class="btn btn-outline-light me-2">
<i class="bi bi-box-arrow-in-right"></i> Login
</a>

<a href="/register" class="btn btn-light me-2">
<i class="bi bi-person-plus"></i> Register
</a>

<a href="/forgot" class="btn btn-warning">
<i class="bi bi-key"></i> Forgot
</a>

</div>

</nav>


<!-- LOGIN CARD -->
<div class="login-container">

<div class="login-card">

<div class="text-center mb-4">

<div class="logo">
<i class="bi bi-shield-lock-fill"></i>
</div>

<h3 class="mt-2">Spam AI Login</h3>

<p class="text-muted">Secure AI Email Detection System</p>

</div>

<form method="POST">

<div class="mb-3">

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>

</div>

<div class="mb-3 position-relative">

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Password"
required>

<i class="bi bi-eye position-absolute"
style="right:15px;top:10px;cursor:pointer"
onclick="togglePassword()"></i>

</div>

<button class="btn btn-primary w-100">

<i class="bi bi-box-arrow-in-right"></i>
Login

</button>

</form>

<!-- BELOW BUTTONS -->
<div class="d-flex justify-content-between mt-3">

<a href="/register" class="btn btn-outline-primary w-50 me-2">
Create Account
</a>

<a href="/forgot" class="btn btn-outline-danger w-50">
Reset Password
</a>

</div>

<hr>

<p class="text-center text-muted small">

AI Spam Detection System © 2026

</p>

</div>

</div>


<script>

function togglePassword(){

let pass = document.getElementById("password");

if(pass.type === "password"){
pass.type="text";
}
else{
pass.type="password";
}

}

</script>

</body>
</html>
