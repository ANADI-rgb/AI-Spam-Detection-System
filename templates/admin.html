<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Panel - Spam AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
background:#eef2f7;
font-family:Segoe UI;
}

.header{
background:#6366f1;
color:white;
padding:15px;
border-radius:10px;
}

.table-container{
margin-top:30px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.message-box{
max-width:350px;
overflow:auto;
white-space:nowrap;
}

.badge-spam{
background:#ef4444;
}

.badge-ham{
background:#22c55e;
}

</style>

</head>

<body>

<div class="container mt-4">

<div class="header d-flex justify-content-between align-items-center">

<h3>
<i class="bi bi-gear"></i>
Admin Dashboard
</h3>

<a href="/" class="btn btn-light">

<i class="bi bi-arrow-left"></i>
Dashboard

</a>

</div>

<div class="table-container">

<h5 class="mb-3">

<i class="bi bi-clock-history"></i>
Prediction Logs

</h5>

<table class="table table-hover table-bordered">

<thead class="table-dark">

<tr>

<th>Time</th>
<th>Email Message</th>
<th>Prediction</th>
<th>Confidence</th>

</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>{{log.time}}</td>

<td class="message-box">
{{log.message}}
</td>

<td>

{% if log.prediction == "Spam" %}

<span class="badge badge-spam">Spam</span>

{% else %}

<span class="badge badge-ham">Not Spam</span>

{% endif %}

</td>

<td>

<div class="progress">

<div class="progress-bar bg-danger"style="width: {{log.confidence}}%">

{{log.confidence}}%

</div>

</div>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
