<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(#6366f1,#9333ea);
}
.card{
width:350px;
padding:25px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="card">

<h3 class="text-center">Register</h3>

<form method="POST">

<input type="fullname" name="fullname" class="form-control mt-3" placeholder="Full Name" required>
<input type="text" name="username" class="form-control mt-3" placeholder="Username" required>
<input type="dateofbirth" name="dob" class="form-control mt-3" placeholder="D.O.B." required>
<input type="password" name="password" class="form-control mt-3" placeholder="Password" required>


<button class="btn btn-primary w-100 mt-3">Register</button>

</form>

<p class="mt-3 text-center">
Already have account? <a href="/login">Login</a>
</p>

</div>

</body>
</html>
