<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(#f59e0b,#ef4444);
}
.card{
width:350px;
padding:25px;
border-radius:15px;
}
</style>

</head>

<body>

<div class="card">

<h3 class="text-center">Reset Password</h3>

<form method="POST">

<input type="text" name="username" class="form-control mt-3" placeholder="Username" required>

<input type="password" name="new_password" class="form-control mt-3" placeholder="New Password" required>

<button class="btn btn-danger w-100 mt-3">Reset</button>

</form>

<p class="mt-3 text-center">
<a href="/login">Back to Login</a>
</p>

</div>

</body>
</html>
